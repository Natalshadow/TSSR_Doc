name: Publish Vault to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs Material and Extensions
        run: |
          pip install mkdocs-material pymdown-extensions

      - name: Auto-create index.md if missing
        run: |
          if [ ! -f docs/index.md ]; then
            echo "# TSSR Lab Vault" > docs/index.md
            echo "Auto-generated documentation homepage." >> docs/index.md
          fi

      - name: Build and Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force

      - name: Send Discord Notification
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚀 **TSSR Documentation Updated!**\nLive site: https://natalshadow.github.io/TSSR_Doc/"}' \
               ${{ secrets.DISCORD_WEBHOOK }}