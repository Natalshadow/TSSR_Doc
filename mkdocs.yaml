site_name: TSSR Documentation & Lab Vault
site_description: TSSR Lab Runbooks, Configs, and Notes
site_url: https://natalshadow.github.io/TSSR_Doc/

docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate # Dark theme
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  # Enable Obsidian-style callouts ([!note], [!abstract], etc.)
  - pymdownx.blocks.admonition:
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
