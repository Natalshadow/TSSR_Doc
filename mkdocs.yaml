site_name: TSSR Evaluation Export
site_description: TSSR Lab Deliverable
site_url: https://natalshadow.github.io/TSSR_Doc/

# Change the target directory to only build files inside docs/exports
docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate # Dark theme
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

plugins:
  - search


markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
