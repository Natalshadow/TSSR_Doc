site_name: TSSR Evaluation Export
site_description: TSSR Lab Deliverable
site_url: https://natalshadow.github.io/TSSR_Doc/

# Change the target directory to only build files inside docs/exports
docs_dir: docs/exports

theme:
  name: material
  palette:
    scheme: slate # Dark theme
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

plugins:
  - search
  - with-pdf:
      author: "Natal"
      cover_title: "TSSR Lab Evaluation"
      cover_subtitle: "Single Note Deliverable"
      toc_title: "Table of Contents"
      heading_shift: true
      toc_level: 3
      output_path: "pdf/single-note.pdf"

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
